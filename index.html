<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro com ViaCEP</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="container">
    <h1>Cadastro de Usuário</h1>

    <p class="descricao">
        Preencha seus dados. Ao informar o CEP, o endereço será buscado automaticamente pela API ViaCEP.
    </p>

    <form id="formulario-cadastro">
        <fieldset>
            <legend>Dados pessoais</legend>

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail">

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone">
        </fieldset>

        <fieldset>
            <legend>Endereço</legend>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" maxlength="9" placeholder="Ex: 01001-000">

            <label for="logradouro">Logradouro:</label>
            <input type="text" id="logradouro" name="logradouro" placeholder="Rua, avenida, praça...">

            <label for="numero">Número:</label>
            <input type="text" id="numero" name="numero" placeholder="Número da residência">

            <label for="complemento">Complemento:</label>
            <input type="text" id="complemento" name="complemento" placeholder="Apartamento, bloco, casa...">

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" name="bairro" placeholder="Bairro">

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" placeholder="Cidade">

            <label for="estado">Estado:</label>
            <input type="text" id="estado" name="estado" placeholder="UF" maxlength="2">
        </fieldset>

        <p id="mensagem"></p>

        <div class="botoes">
            <button type="submit">Salvar cadastro</button>
            <button type="button" id="botao-limpar">Limpar dados</button>
        </div>
    </form>
</main>

<script src="scripts.js"></script>
</body>
</html>
